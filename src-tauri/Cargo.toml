[package]
name = "compost-marketplace"
version = "0.0.1"
description = "Powder Keg WV — FGW compost marketplace on Nostr"
authors = ["Gary Krause"]
edition = "2021"

[lib]
name = "compost_marketplace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-stronghold = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SPEC-035: barcode scanner is a mobile-only Tauri 2 plugin (iOS/Android).
# Gating the dependency keeps desktop builds (and `pnpm tauri dev`) compiling.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
